<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cola-prova</title>
<style>
  body {
    background: #121212;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    margin-bottom: 15px;
  }
  textarea {
    width: 300px;
    height: 100px;
    background: #222;
    color: #eee;
    border: 2px solid #444;
    border-radius: 6px;
    padding: 10px;
    resize: none;
    font-size: 16px;
  }
  button {
    background: #0f0;
    color: #000;
    font-weight: bold;
    border: none;
    padding: 10px 25px;
    margin: 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s;
  }
  button:hover {
    background: #0c0;
  }
  .container {
    display: flex;
    gap: 20px;
  }
  #output {
    margin-top: 15px;
    font-size: 18px;
    background: #222;
    padding: 15px;
    border-radius: 6px;
    width: 300px;
    min-height: 60px;
    word-break: break-word;
  }
</style>
</head>
<body>

<h1>Cifra de César (chave 4)</h1>

<textarea id="inputText" placeholder="Digite a mensagem aqui..."></textarea>

<div class="container">
  <button onclick="cifrar()">Criptografar</button>
  <button onclick="decifrar()">Descriptografar</button>
</div>

<div id="output" placeholder="Resultado aqui..."></div>

<script>
  const chave = 4;

  function cifrar() {
    const texto = document.getElementById('inputText').value;
    document.getElementById('output').innerText = caesar(texto, chave);
  }

  function decifrar() {
    const texto = document.getElementById('inputText').value;
    document.getElementById('output').innerText = caesar(texto, -chave);
  }

  function caesar(str, shift) {
    return str.split('').map(char => {
      const code = char.charCodeAt(0);
      // Maiúsculas A-Z
      if (code >= 65 && code <= 90) {
        return String.fromCharCode(((code - 65 + shift + 26) % 26) + 65);
      }
      // Minúsculas a-z
      if (code >= 97 && code <= 122) {
        return String.fromCharCode(((code - 97 + shift + 26) % 26) + 97);
      }
      // Outros caracteres ficam iguais
      return char;
    }).join('');
  }
</script>

</body>
</html>
