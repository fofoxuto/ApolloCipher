<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apollo Cipher - Cifra de César</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      /* Fundo preto fosco */
      --bg-color: #0d0d0d;
      
      /* Cinza fosco translúcido para o efeito Liquid Glass */
      --card-bg: rgba(30, 30, 32, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      
      --output-bg: rgba(18, 18, 20, 0.6);
      --output-hover: rgba(24, 24, 27, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      /* Detalhe opcional para dar profundidade ao fundo preto fosco */
      background-image: radial-gradient(circle at 50% 20%, #1a1a24 0%, #0d0d0d 100%);
    }

    .cipher-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      
      /* Efeito Liquid Glass / Glassmorphism */
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--text-main);
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .key-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--output-bg);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .key-container input {
      width: 70px;
      padding: 6px;
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      text-align: center;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .key-container input:focus {
      border-color: var(--primary);
      background: rgba(0, 0, 0, 0.5);
    }

    textarea {
      width: 100%;
      height: 110px;
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      resize: none;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      border: none;
      padding: 12px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    button:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.97) translateY(0);
    }

    .material-symbols-outlined {
      font-size: 1.1rem;
    }

    #output {
      font-size: 0.95rem;
      background: var(--output-bg);
      color: var(--text-main);
      border: 1px dashed var(--card-border);
      padding: 16px;
      border-radius: 12px;
      width: 100%;
      min-height: 70px;
      word-break: break-word;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      position: relative;
    }

    #output:hover {
      background: var(--output-hover);
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <main class="cipher-card">
    <h1>Apollo Cipher</h1>
    
    <div class="key-container">
      <label for="shiftKey">Chave de Deslocamento:</label>
      <input type="number" id="shiftKey" value="4" min="1" max="25">
    </div>

    <textarea id="inputText" placeholder="Digite a mensagem aqui..."></textarea>

    <div class="actions">
      <button id="encryptBtn">
        <span class="material-symbols-outlined">lock</span>
        Criptografar
      </button>
      <button id="decryptBtn">
        <span class="material-symbols-outlined">lock_open</span>
        Descriptografar
      </button>
    </div>

    <div id="output" title="Clique para copiar">O resultado aparecerá aqui...</div>
  </main>

  <script>
    const inputElement = document.getElementById('inputText');
    const outputElement = document.getElementById('output');
    const shiftKeyInput = document.getElementById('shiftKey');
    const encryptBtn = document.getElementById('encryptBtn');
    const decryptBtn = document.getElementById('decryptBtn');

    let currentResultText = 'O resultado aparecerá aqui...';

    function shiftChar(char, shift) {
      const code = char.charCodeAt(0);
      const normalizedShift = ((shift % 26) + 26) % 26;

      if (code >= 65 && code <= 90) {
        return String.fromCharCode(((code - 65 + normalizedShift) % 26) + 65);
      }
      if (code >= 97 && code <= 122) {
        return String.fromCharCode(((code - 97 + normalizedShift) % 26) + 97);
      }
      
      return char;
    }

    function caesarCipher(text, shift) {
      return text.split('').map(char => shiftChar(char, shift)).join('');
    }

    function handleProcess(isEncrypting) {
      const text = inputElement.value;
      const userKey = parseInt(shiftKeyInput.value) || 0;
      const effectiveShift = isEncrypting ? userKey : -userKey;
      
      if (!text.trim()) {
        currentResultText = 'Por favor, digite um texto válido.';
        outputElement.textContent = currentResultText;
        return;
      }

      currentResultText = caesarCipher(text, effectiveShift);
      outputElement.textContent = currentResultText;
    }

    outputElement.addEventListener('click', () => {
      if (!currentResultText || currentResultText.startsWith('O resultado') || currentResultText.startsWith('Por favor')) {
        return;
      }

      navigator.clipboard.writeText(currentResultText).then(() => {
        const originalText = outputElement.textContent;
        outputElement.textContent = 'Copiado para a área de transferência! ✨';
        
        setTimeout(() => {
          outputElement.textContent = originalText;
        }, 1500);
      });
    });

    encryptBtn.addEventListener('click', () => handleProcess(true));
    decryptBtn.addEventListener('click', () => handleProcess(false));
  </script>

</body>
</html>
