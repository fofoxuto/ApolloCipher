<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apollo Cipher - Cifra de César</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --bg-color: #09090b;
      --capsule-bg: rgba(24, 24, 27, 0.65);
      --capsule-border: rgba(255, 255, 255, 0.08);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(circle at 50% 10%, #18181b 0%, var(--bg-color) 100%);
    }

    .cipher-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 440px;
    }

    /* Estilo padrão de Cápsula / Liquid Glass */
    .capsule {
      background: var(--capsule-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--capsule-border);
      border-radius: 28px;
      padding: 16px 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s, background 0.2s;
    }

    .title-capsule {
      justify-content: center;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      padding: 18px;
    }

    .key-capsule {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .key-capsule input {
      width: 65px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-main);
      border: 1px solid var(--capsule-border);
      border-radius: 14px;
      text-align: center;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .key-capsule input:focus {
      border-color: var(--accent);
    }

    .textarea-capsule {
      flex-direction: column;
      align-items: stretch;
      padding: 16px;
      border-radius: 24px;
    }

    textarea {
      width: 100%;
      height: 100px;
      background: transparent;
      color: var(--text-main);
      border: none;
      resize: none;
      font-size: 0.95rem;
      outline: none;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .actions-capsule {
      padding: 10px;
      background: transparent;
      border: none;
      box-shadow: none;
      gap: 12px;
    }

    button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--capsule-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--capsule-border);
      color: var(--text-main);
      font-weight: 600;
      padding: 14px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    button:hover {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.97) translateY(0);
    }

    .material-symbols-outlined {
      font-size: 1.2rem;
    }

    #output {
      font-size: 0.95rem;
      color: var(--text-main);
      min-height: 75px;
      word-break: break-word;
      cursor: pointer;
      border-radius: 24px;
      padding: 20px;
      border: 1px dashed var(--capsule-border);
    }

    #output:hover {
      background: rgba(30, 30, 35, 0.8);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <main class="cipher-container">
    <div class="capsule title-capsule">
      Apollo Cipher
    </div>
    
    <div class="capsule key-capsule">
      <label for="shiftKey">Chave de Deslocamento:</label>
      <input type="number" id="shiftKey" value="4" min="1" max="25">
    </div>

    <div class="capsule textarea-capsule">
      <textarea id="inputText" placeholder="Digite a mensagem aqui..."></textarea>
    </div>

    <div class="actions-capsule">
      <button id="encryptBtn">
        <span class="material-symbols-outlined">lock</span>
        Criptografar
      </button>
      <button id="decryptBtn">
        <span class="material-symbols-outlined">lock_open</span>
        Descriptografar
      </button>
    </div>

    <div class="capsule" id="output" title="Clique para copiar">O resultado aparecerá aqui...</div>
  </main>

  <script>
    const inputElement = document.getElementById('inputText');
    const outputElement = document.getElementById('output');
    const shiftKeyInput = document.getElementById('shiftKey');
    const encryptBtn = document.getElementById('encryptBtn');
    const decryptBtn = document.getElementById('decryptBtn');

    let currentResultText = 'O resultado aparecerá aqui...';

    function shiftChar(char, shift) {
      const code = char.charCodeAt(0);
      const normalizedShift = ((shift % 26) + 26) % 26;

      if (code >= 65 && code <= 90) {
        return String.fromCharCode(((code - 65 + normalizedShift) % 26) + 65);
      }
      if (code >= 97 && code <= 122) {
        return String.fromCharCode(((code - 97 + normalizedShift) % 26) + 97);
      }
      
      return char;
    }

    function caesarCipher(text, shift) {
      return text.split('').map(char => shiftChar(char, shift)).join('');
    }

    function handleProcess(isEncrypting) {
      const text = inputElement.value;
      const userKey = parseInt(shiftKeyInput.value) || 0;
      const effectiveShift = isEncrypting ? userKey : -userKey;
      
      if (!text.trim()) {
        currentResultText = 'Por favor, digite um texto válido.';
        outputElement.textContent = currentResultText;
        return;
      }

      currentResultText = caesarCipher(text, effectiveShift);
      outputElement.textContent = currentResultText;
    }

    outputElement.addEventListener('click', () => {
      if (!currentResultText || currentResultText.startsWith('O resultado') || currentResultText.startsWith('Por favor')) {
        return;
      }

      navigator.clipboard.writeText(currentResultText).then(() => {
        const originalText = outputElement.textContent;
        outputElement.textContent = 'Copiado para a área de transferência! ✨';
        
        setTimeout(() => {
          outputElement.textContent = originalText;
        }, 1500);
      });
    });

    encryptBtn.addEventListener('click', () => handleProcess(true));
    decryptBtn.addEventListener('click', () => handleProcess(false));
  </script>

</body>
</html>
