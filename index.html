<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apollo Cipher - Cifra de César</title>
  
  <!-- Google Fonts - Material Symbols (Material 3) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-color: #e2e8f0;
      --primary: #667eea;
      --primary-hover: #5a67d8;
      --output-bg: #f7fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .cipher-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--text-main);
      text-align: center;
      font-weight: 600;
    }

    .key-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--output-bg);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .key-container input {
      width: 70px;
      padding: 6px;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      text-align: center;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .key-container input:focus {
      border-color: var(--primary);
    }

    textarea {
      width: 100%;
      height: 100px;
      background: #ffffff;
      color: var(--text-main);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      resize: none;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      border: none;
      padding: 12px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 6px rgba(102, 126, 234, 0.2);
    }

    button:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 8px rgba(102, 126, 234, 0.3);
    }

    button:active {
      transform: scale(0.97);
    }

    .material-symbols-outlined {
      font-size: 1.1rem;
    }

    #output {
      font-size: 0.95rem;
      background: var(--output-bg);
      color: var(--text-main);
      border: 2px dashed var(--border-color);
      padding: 15px;
      border-radius: 10px;
      width: 100%;
      min-height: 70px;
      word-break: break-word;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <main class="cipher-card">
    <h1>Apollo Cipher</h1>
    
    <!-- Seletor de Chave -->
    <div class="key-container">
      <label for="shiftKey">Chave de Deslocamento:</label>
      <input type="number" id="shiftKey" value="4" min="1" max="25">
    </div>

    <textarea id="inputText" placeholder="Digite a mensagem aqui..."></textarea>

    <div class="actions">
      <button id="encryptBtn">
        <span class="material-symbols-outlined">lock</span>
        Criptografar
      </button>
      <button id="decryptBtn">
        <span class="material-symbols-outlined">lock_open</span>
        Descriptografar
      </button>
    </div>

    <div id="output">O resultado aparecerá aqui...</div>
  </main>

  <script>
    const inputElement = document.getElementById('inputText');
    const outputElement = document.getElementById('output');
    const shiftKeyInput = document.getElementById('shiftKey');
    const encryptBtn = document.getElementById('encryptBtn');
    const decryptBtn = document.getElementById('decryptBtn');

    function shiftChar(char, shift) {
      const code = char.charCodeAt(0);

      // Garante que o shift permaneça dentro do limite do alfabeto (0-25)
      const normalizedShift = ((shift % 26) + 26) % 26;

      if (code >= 65 && code <= 90) {
        return String.fromCharCode(((code - 65 + normalizedShift) % 26) + 65);
      }
      if (code >= 97 && code <= 122) {
        return String.fromCharCode(((code - 97 + normalizedShift) % 26) + 97);
      }
      
      return char;
    }

    function caesarCipher(text, shift) {
      return text.split('').map(char => shiftChar(char, shift)).join('');
    }

    function handleProcess(isEncrypting) {
      const text = inputElement.value;
      const userKey = parseInt(shiftKeyInput.value) || 0;
      const effectiveShift = isEncrypting ? userKey : -userKey;
      
      if (!text.trim()) {
        outputElement.textContent = 'Por favor, digite um texto válido.';
        return;
      }

      outputElement.textContent = caesarCipher(text, effectiveShift);
    }

    encryptBtn.addEventListener('click', () => handleProcess(true));
    decryptBtn.addEventListener('click', () => handleProcess(false));
  </script>

</body>
</html>
